<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Validation score by learning batch (proposal level). 3 runs per point, 40 validation transcripts; oracle reviewer, rules gated">
