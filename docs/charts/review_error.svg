<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Share of proposals the oracle edited or rejected, by batch. Each batch is reviewed with the version in force at that point; bands are 95% Wilson intervals">
