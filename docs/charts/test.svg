<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Test split: proposal-level vs truth-level score. 20 test transcripts x 9 fields, 5 runs per arm; the final arm was tuned toward the proposal metric">
<style>
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#8a8984}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--grid:#34332f;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#8a8984}}
text{font-family:system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:var(--ink)}
.t{font-size:16px;font-weight:600}.sub{font-size:12px;fill:var(--ink2)}.ax{font-size:11px;fill:var(--ink2)}
.lab{font-size:12px}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--ink2);stroke-width:1}
</style>
<rect width="720" height="400" fill="var(--bg)"/>
<text class="t" x="24" y="28">Test split: proposal-level vs truth-level score</text>
<text class="sub" x="24" y="46">20 test transcripts x 9 fields, 5 runs per arm; the final arm was tuned toward the proposal metric</text>
<line x1="24" x2="46" y1="68" y2="68" stroke="var(--s1)" stroke-width="2.5"/>
<text class="lab" x="52" y="72">Proposal level (expected CRM proposal)</text>
<line x1="340" x2="362" y1="68" y2="68" stroke="var(--s2)" stroke-width="2.5"/>
<text class="lab" x="368" y="72">Truth level (what was said)</text>
<line class="grid" x1="60" x2="680" y1="330.0" y2="330.0"/>
<text class="ax" x="52" y="334.0" text-anchor="end">0.00</text>
<line class="grid" x1="60" x2="680" y1="274.5" y2="274.5"/>
<text class="ax" x="52" y="278.5" text-anchor="end">0.25</text>
<line class="grid" x1="60" x2="680" y1="219.0" y2="219.0"/>
<text class="ax" x="52" y="223.0" text-anchor="end">0.50</text>
<line class="grid" x1="60" x2="680" y1="163.5" y2="163.5"/>
<text class="ax" x="52" y="167.5" text-anchor="end">0.75</text>
<line class="grid" x1="60" x2="680" y1="108.0" y2="108.0"/>
<text class="ax" x="52" y="112.0" text-anchor="end">1.00</text>
<line class="axis" x1="60" x2="680" y1="330" y2="330"/>
<text class="ax" x="370" y="364" text-anchor="middle"></text>
<text class="ax" transform="translate(16 219) rotate(-90)" text-anchor="middle">Mean score</text>
<rect x="109.3" y="148.5" width="52" height="181.5" rx="3" fill="var(--s1)"/>
<text class="lab" x="135.3" y="142.5" text-anchor="middle">0.818</text>
<rect x="165.3" y="135.0" width="52" height="195.0" rx="3" fill="var(--s2)"/>
<text class="lab" x="191.3" y="129.0" text-anchor="middle">0.879</text>
<text class="lab" x="163.3" y="348" text-anchor="middle">V0</text>
<rect x="316.0" y="140.8" width="52" height="189.2" rx="3" fill="var(--s1)"/>
<text class="lab" x="342.0" y="134.8" text-anchor="middle">0.852</text>
<rect x="372.0" y="124.5" width="52" height="205.5" rx="3" fill="var(--s2)"/>
<text class="lab" x="398.0" y="118.5" text-anchor="middle">0.926</text>
<text class="lab" x="370.0" y="348" text-anchor="middle">Manual baseline</text>
<rect x="522.7" y="127.5" width="52" height="202.5" rx="3" fill="var(--s1)"/>
<text class="lab" x="548.7" y="121.5" text-anchor="middle">0.912</text>
<rect x="578.7" y="141.3" width="52" height="188.7" rx="3" fill="var(--s2)"/>
<text class="lab" x="604.7" y="135.3" text-anchor="middle">0.850</text>
<text class="lab" x="576.7" y="348" text-anchor="middle">Final (rules + examples)</text>
</svg>
