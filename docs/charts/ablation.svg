<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Ablation on validation: final state with and without each ingredient. 5 runs per arm, 40 validation transcripts; dot = one run, tick = mean">
