[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interaction-to-crm"
version = "0.1.0"
description = "Call transcripts in, reviewed HubSpot deal updates out, with a measured learning loop."
requires-python = ">=3.9"
dependencies = [
  "slack-bolt>=1.18",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mutmut>=3"]
# Added per milestone, not up front:
# M2:    pydantic
# M6:    matplotlib

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = ["crm/"]
tests_dir = ["tests/"]
# crm/extractor.py and crm/learner.py resolve prompts and taxonomy from the package's parent directory
also_copy = ["prompts/", "data/", "scripts/", "pyproject.toml"]
do_not_mutate = ["crm/slack_app.py", "crm/handreview.py", "crm/slice.py", "crm/cli.py", "crm/__main__.py"]

[tool.setuptools]
packages = ["crm"]
